name: Fleet dependency CI
'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fleet-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
    - name: Build app and instrumentation together
      run: 'chmod +x gradlew

        ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug'
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm'
    - name: Run actual instrumentation tests
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
      with:
        api-level: 35
        arch: x86_64
        disable-animations: true
        script: >-
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest connectedDebugAndroidTest ||
          { test_status=$?; adb logcat -d -v threadtime > app/build/instrumentation-logcat.txt; exit "$test_status"; }
    - name: Retain failed instrumentation results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: failed-instrumentation-results
        retention-days: 7
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/instrumentation-logcat.txt
