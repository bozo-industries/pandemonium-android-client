plugins { id 'com.android.application' }

android {
    namespace 'page.claras.pandemonium'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'page.claras.pandemonium'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        if (System.getenv('PANDEMONIUM_SIGNING_STORE') && System.getenv('PANDEMONIUM_SIGNING_PASSWORD')) {
            release {
                storeFile file(System.getenv('PANDEMONIUM_SIGNING_STORE'))
                storePassword System.getenv('PANDEMONIUM_SIGNING_PASSWORD')
                keyAlias 'pandemonium'
                keyPassword System.getenv('PANDEMONIUM_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.findByName('release')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
}
